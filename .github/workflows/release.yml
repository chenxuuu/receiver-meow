name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: environment prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build
        run: |
          cd ReceiverMeow
          for rid in win-x86 win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "=== building $rid"
            dotnet publish --configuration Release -r "$rid" -p:PublishSingleFile=true --self-contained true || exit 1
            mkdir -p "$rid"
            mv "ReceiverMeow/bin/Release/net10.0/$rid/publish/"* "$rid/"
            zip -r "$rid.zip" "$rid"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ReceiverMeow/*.zip
